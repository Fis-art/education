name: Deploy Production

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to deploy'
        required: true
        type: string

env:
  SERVER_HOST: ${{ secrets.PRODUCTION_SERVER_HOST }}
  SERVER_USER: ${{ secrets.PRODUCTION_SERVER_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version || github.event.release.tag_name }}

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ env.SSH_PRIVATE_KEY }}

      - name: Deploy to Production Server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} << 'EOF'
            cd /opt/smk-teknologi-plus
            git fetch --tags
            git checkout ${{ github.event.inputs.version || github.event.release.tag_name }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --build
            docker compose -f docker-compose.prod.yml exec -T backend npm run db:migrate
          EOF

      - name: Health Check
        run: |
          sleep 30
          curl -f https://smktekplus.sch.id/health || exit 1

      - name: Notify Success
        if: success()
        run: |
          echo "✅ Production deployment successful!"
          # Add notification webhook here (Slack, Discord, etc.)