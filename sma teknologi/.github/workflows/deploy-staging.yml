name: Deploy Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  SERVER_HOST: ${{ secrets.STAGING_SERVER_HOST }}
  SERVER_USER: ${{ secrets.STAGING_SERVER_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ env.SSH_PRIVATE_KEY }}

      - name: Deploy to Staging Server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} << 'EOF'
            cd /opt/smk-teknologi-plus-staging
            git pull origin develop
            docker compose -f docker-compose.staging.yml pull
            docker compose -f docker-compose.staging.yml up -d --build
            docker compose -f docker-compose.staging.yml exec -T backend npm run db:migrate
            docker compose -f docker-compose.staging.yml exec -T backend npm run db:seed
          EOF

      - name: Health Check
        run: |
          sleep 30
          curl -f https://staging.smktekplus.sch.id/health || exit 1