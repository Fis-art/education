version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: smk-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smk_tekplus
      MYSQL_USER: smk_user
      MYSQL_PASSWORD: smk_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smk-network

  redis:
    image: redis:7-alpine
    container_name: smk-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smk-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: smk-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: smk_user
      PMA_PASSWORD: smk_pass
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - smk-network

volumes:
  mysql_data:
  redis_data:

networks:
  smk-network:
    driver: bridge